# Heimdal — Render Blueprint (Infrastructure as Code)
# Docs: https://render.com/docs/blueprint-spec

services:
  # ─── API Service (NestJS) ─────────────────────────────────────────────────
  - type: web
    name: heimdal-api
    runtime: docker
    dockerfilePath: apps/api/Dockerfile
    dockerContext: .
    plan: starter
    region: oregon
    branch: master
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "8000"
      - key: DATABASE_URL
        fromDatabase:
          name: heimdal-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRY
        value: 15m
      - key: REFRESH_TOKEN_EXPIRY
        value: 7d
      - key: CORS_ORIGINS
        value: https://heimdal-admin.onrender.com
      - key: ADMIN_BOOTSTRAP_EMAIL
        sync: false
      - key: ADMIN_BOOTSTRAP_PASSWORD
        sync: false

  # ─── Admin UI (Vite SPA) ─────────────────────────────────────────────────
  - type: web
    name: heimdal-admin
    runtime: static
    buildCommand: npm ci && npx turbo run build --filter=@heimdal/admin
    staticPublishPath: apps/admin/dist
    branch: master
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://heimdal-api.onrender.com

# ─── Database ──────────────────────────────────────────────────────────────
databases:
  - name: heimdal-db
    plan: starter
    databaseName: heimdal
    user: heimdal
    region: oregon
    postgresMajorVersion: "16"
